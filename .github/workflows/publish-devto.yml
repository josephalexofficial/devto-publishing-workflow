name: Publish Articles to DEV.to

on:
  push:
    branches:
      - main
    paths:
      - "articles/**/*.md"
      - "scripts/devto_publish.py"
      - ".github/workflows/publish-devto.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    name: Publish Markdown articles
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Choose articles to publish
        id: choose
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "all=true" >> "$GITHUB_OUTPUT"
          else
            echo "all=false" >> "$GITHUB_OUTPUT"
          fi

          {
            echo "files<<EOF"
            git diff --name-only HEAD^ HEAD -- articles || true
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Publish articles to DEV.to
        env:
          DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
          PUBLISH_ALL: ${{ steps.choose.outputs.all }}
          CHANGED_ARTICLES: ${{ steps.choose.outputs.files }}
        run: |
          if [ -z "$DEVTO_API_KEY" ]; then
            echo "::notice::Skipping DEV.to publishing because DEVTO_API_KEY is not configured."
            exit 0
          fi

          python scripts/devto_publish.py

      - name: Save DEV.to article ids
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: save DEV.to article ids"
          file_pattern: articles/*.md
